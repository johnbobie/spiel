<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Schätzduell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2447"/>
      <stop offset="1" stop-color="#14121f"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#f7a1c4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Reglerschiene -->
  <rect x="76" y="242" width="360" height="28" rx="14" fill="url(#track)" opacity="0.35"/>
  <rect x="76" y="242" width="196" height="28" rx="14" fill="url(#track)"/>

  <!-- Marke der richtigen Antwort -->
